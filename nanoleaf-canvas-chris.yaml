esphome:
  name: nanoleaf-canvas-chris
  friendly_name: Nanoleaf Canvas

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: "YourSSID"
  password: "YourPassword"
  ap:
    ssid: "Nanoleaf-Canvas-Fallback"

captive_portal:

logger:
  hardware_uart: UART0
  level: INFO

api:

ota:
  platform: esphome

web_server:
  port: 80

nanoleaf_canvas:
  id: canvas_hub
  data_pin: 4

light:
  - platform: nanoleaf_canvas
    name: "Nanoleaf Canvas"
    id: canvas_light
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
